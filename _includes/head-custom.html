<style>
    :root {
        color-scheme: light;
    }

    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    body.has-floating-nav .page-content {
        margin-left: 280px;
        transition: margin-left 0.3s ease;
    }

    #floating-nav {
        position: fixed;
        top: 120px;
        left: 24px;
        width: 240px;
        z-index: 1000;
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        box-shadow: 0 12px 24px rgba(31, 36, 41, 0.08);
        overflow: hidden;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    #floating-nav .floating-nav-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background-color: #f7f9fb;
        border-bottom: 1px solid #e0e6ed;
    }

    #floating-nav .floating-nav-title {
        font-size: 18px;
        font-weight: 600;
        color: #1f2429;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    #floating-nav .floating-nav-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: #ffffff;
        color: #1f2429;
        font-size: 20px;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    #floating-nav .floating-nav-toggle:focus-visible {
        outline: 2px solid #1f6feb;
        outline-offset: 2px;
    }

    #floating-nav .floating-nav-toggle:hover {
        background-color: #e9eef6;
        border-color: #d0d7e1;
    }

    #floating-nav .floating-nav-toggle-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
    }

    #floating-nav .floating-nav-links {
        list-style: none;
        margin: 0;
        padding: 12px 0 16px;
        max-height: calc(100vh - 220px);
        overflow-y: auto;
    }

    #floating-nav .floating-nav-item {
        margin: 0;
    }

    #floating-nav .floating-nav-link {
        display: block;
        padding: 10px 20px;
        color: #1f2933;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        border-left: 4px solid transparent;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    #floating-nav .floating-nav-link:hover,
    #floating-nav .floating-nav-link:focus-visible {
        background-color: #f0f4fb;
        border-color: #1f6feb;
        color: #1f6feb;
        outline: none;
    }

    #floating-nav .floating-nav-link:active {
        background-color: #e3eaf6;
    }

    #floating-nav.is-mobile {
        left: auto;
        right: 16px;
        bottom: 24px;
        top: auto;
        width: min(320px, calc(100% - 32px));
        border-radius: 16px;
    }

    #floating-nav.is-mobile .floating-nav-header {
        padding: 14px 18px;
    }

    #floating-nav.is-mobile .floating-nav-toggle {
        display: inline-flex;
    }

    #floating-nav.is-mobile .floating-nav-links {
        max-height: min(50vh, 420px);
        padding: 0 0 12px;
    }

    #floating-nav.is-mobile.collapsed .floating-nav-links {
        display: none;
    }

    #floating-nav.is-mobile .floating-nav-link {
        padding: 12px 18px;
    }

    @media (max-width: 1200px) {
        body.has-floating-nav .page-content {
            margin-left: 260px;
        }

        #floating-nav {
            width: 220px;
        }
    }

    @media (max-width: 992px) {
        body.has-floating-nav .page-content {
            margin-left: 0;
        }

        #floating-nav {
            box-shadow: 0 18px 34px rgba(15, 23, 42, 0.2);
        }

        #floating-nav .floating-nav-links {
            padding-top: 0;
        }
    }

    /* 1. CSS cho Mục Lục Trôi */
    #floating-toc-container {
        position: fixed;
        top: 80px;
        right: 24px;
        width: 300px;
        z-index: 900;
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        max-height: calc(100vh - 120px);
        display: none;
    }

    #floating-toc-title {
        padding: 14px 18px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background-color: #f7f9fb;
        border-bottom: 1px solid #e0e0e0;
        border-radius: 12px 12px 0 0;
        user-select: none;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    #floating-toc-title::after {
        content: '\25B2';
        font-size: 12px;
        transition: transform 0.2s ease;
    }

    #floating-toc-container.toc-collapsed #floating-toc-title::after {
        transform: rotate(180deg);
    }

    #floating-toc-container #toc {
        padding: 12px 20px 18px 32px;
        font-size: 14px;
        max-height: 420px;
        overflow-y: auto;
        display: block;
        margin: 0;
        scroll-behavior: smooth;
    }

    #floating-toc-container.toc-collapsed #toc {
        display: none;
    }

    #floating-toc-container #toc ul {
        padding-left: 18px;
        margin: 12px 0 0;
        border-left: 1px dashed #d0d7e1;
    }

    #floating-toc-container #toc li {
        margin-top: 10px;
        list-style: none;
        position: relative;
    }

    #floating-toc-container #toc a {
        text-decoration: none;
        color: #1f6feb;
    }

    #floating-toc-container #toc a:hover {
        color: #1f6feb;
        background-color: rgba(31, 111, 235, 0.08);
    }

    #floating-toc-container #toc a::before {
        content: '\2022';
        color: #9aa5b1;
        font-size: 12px;
        transform: translateY(-1px);
    }

    #floating-toc-container #toc a.active {
        color: #1f6feb;
        font-weight: 600;
        background-color: rgba(31, 111, 235, 0.12);
        box-shadow: inset 2px 0 0 #1f6feb;
    }

    #floating-toc-container #toc a.active::before {
        color: #1f6feb;
    }

    .main-content>p:first-child>ul#markdown-toc,
    .main-content>ul#markdown-toc,
    .main-content>p:first-child>ul#toc,
    .main-content>ul#toc {
        display: none !important;
    }

    @media (max-width: 1200px) {
        #floating-toc-container {
            width: 260px;
        }
    }

    @media (max-width: 992px) {
        #floating-toc-container {
            position: static;
            width: auto;
            max-width: 100%;
            box-shadow: none;
            border-radius: 12px;
            margin: 24px 0;
        }

        #floating-toc-container #toc {
            max-height: none;
        }
    }
    /* Override header to use banner image instead of gradient */
    .page-header {
        position: relative;
        background: url("{{ '/images/banner.png' | relative_url }}") center/cover no-repeat;
        color: #fff;
    }

    /* Semi-transparent overlay to improve contrast */
    .page-header::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.35));
        z-index: 0;
    }

    /* Ensure header content sits above overlay */
    .page-header > * { position: relative; z-index: 1; }

    .page-header .project-name,
    .page-header .project-tagline {
        color: #fff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
    }

    /* Improve button visibility on banner */
    .page-header .btn {
        color: #fff !important;
        border-color: rgba(255, 255, 255, 0.8) !important;
        background-color: rgba(255, 255, 255, 0.15) !important;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        backdrop-filter: saturate(120%) blur(2px);
    }

    .page-header .btn:hover,
    .page-header .btn:focus {
        background-color: rgba(255, 255, 255, 0.25) !important;
        border-color: #fff !important;
        color: #fff !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var homeButton = document.querySelector(".page-header .btn");
        if (homeButton) {
            homeButton.innerHTML = "Trang chủ";
            homeButton.href = "{{ site.baseurl | default: '' }}/";
        }

        var footerContainer = document.querySelector(".site-footer");
        if (footerContainer) {
            footerContainer.innerHTML = `<span class="site-footer-credits">
                                            Bản quyền © 2025 VIAIBOT. Phát hành bởi VNPT Vĩnh Long.
                                        </span>`;
        }

        var floatingNav = document.getElementById("floating-nav");
        var navToggle = document.getElementById("floating-nav-toggle");
        var navToggleIcon = navToggle ? navToggle.querySelector(".floating-nav-toggle-icon") : null;
        if (floatingNav) {
            document.body.classList.add("has-floating-nav");

            var updateNavMode = function () {
                if (window.innerWidth <= 992) {
                    floatingNav.classList.add("is-mobile");
                    if (!floatingNav.classList.contains("collapsed")) {
                        floatingNav.classList.add("collapsed");
                    }
                    if (navToggle) {
                        navToggle.setAttribute("aria-expanded", "false");
                    }
                    if (navToggleIcon) {
                        navToggleIcon.textContent = "☰";
                    }
                } else {
                    floatingNav.classList.remove("is-mobile");
                    floatingNav.classList.remove("collapsed");
                    if (navToggle) {
                        navToggle.setAttribute("aria-expanded", "true");
                    }
                    if (navToggleIcon) {
                        navToggleIcon.textContent = "✕";
                    }
                }
            };

            if (navToggle) {
                navToggle.addEventListener("click", function () {
                    var isCollapsed = floatingNav.classList.toggle("collapsed");
                    var expanded = (!isCollapsed).toString();
                    navToggle.setAttribute("aria-expanded", expanded);
                    if (navToggleIcon) {
                        navToggleIcon.textContent = isCollapsed ? "☰" : "✕";
                    }
                });
            }

            updateNavMode();
            window.addEventListener("resize", updateNavMode);
        }

        // Support both Kramdown default (#markdown-toc) and custom (#toc)
        var originalToc = document.querySelector(".main-content ul#markdown-toc, .main-content ul#toc");
        var floatingContainer = document.getElementById("floating-toc-container");
        var tocTitle = document.getElementById("floating-toc-title");

        if (originalToc && floatingContainer && tocTitle) {
            floatingContainer.appendChild(originalToc);

            var contentEl = document.getElementById('content');
            var updateTocVisibility = function () {
                var show = false;
                if (contentEl) {
                    var rect = contentEl.getBoundingClientRect();
                    show = rect.top <= 80; // show once main content reaches near top
                } else {
                    show = window.scrollY > 150;
                }
                floatingContainer.style.display = show ? 'block' : 'none';
            };

            updateTocVisibility();
            window.addEventListener('scroll', updateTocVisibility, { passive: true });
            window.addEventListener('resize', updateTocVisibility);

            tocTitle.addEventListener("click", function () {
                var isCollapsed = floatingContainer.classList.toggle("toc-collapsed");
                tocTitle.setAttribute("aria-expanded", (!isCollapsed).toString());
            });
        }
    });
</script>
